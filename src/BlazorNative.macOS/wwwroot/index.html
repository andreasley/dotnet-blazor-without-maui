<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Blazor Native (macOS)</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/BlazorNative.Shared/css/app.css" />
</head>
<body>
    <div id="app">Loading…</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!--
        blazor.webview.js is embedded in the Microsoft.AspNetCore.Components.WebView package and served
        by WebViewManager. autostart="false" because the native host injects the window.external bridge
        first and then calls Blazor.start() itself.
    -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
